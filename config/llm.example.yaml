version: 1
system_prompt: You are a professional and reliable local assistant. Answer accurately and concisely.
default_model:
  provider: deepseek
  model: deepseek-v4-flash
history:
  max_messages: 40
search:
  enabled: true
  provider: duckduckgo
  max_results: 5
  fetch_pages: 3
  timeout: 10
  user_agent: AgentDogs/0.1
code_execution:
  enabled: true
  backend: local_process
  image: python:3.11-slim
  timeout_seconds: 20
  memory_limit: 512m
  cpu_limit: 1
  network_enabled: true
  workspace_readonly: true
  artifacts_dir: runtime/artifacts
  max_output_chars: 12000
  allow_user_script_execution: true
  max_artifacts: 20
  max_artifact_bytes: 26214400
  opensandbox:
    domain: ${OPENSANDBOX_DOMAIN:-127.0.0.1:8080}
    protocol: ${OPENSANDBOX_PROTOCOL:-http}
    api_key: ${OPENSANDBOX_API_KEY:-}
    request_timeout_seconds: 60
    use_server_proxy: false
    ready_timeout_seconds: 30
  local_process:
    python_executable: ${AGENT_LOCAL_PYTHON:-}
    runs_dir: runtime/local_runs
    deps_dir: runtime/local_deps
    cleanup_runs: true
    require_human_approval: true
    approval_scope:
      command_execution: always
      dependency_install: first_time
      workspace_write: always
      network_access: always
  dependency_install:
    enabled: true
    timeout_seconds: 120
    allowed_packages:
      - pandas
      - numpy
      - openpyxl
      - matplotlib
      - seaborn
      - scipy
      - scikit-learn
providers:
  deepseek:
    type: openai_compatible
    enabled: true
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY:-}
    model: deepseek-v4-flash
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
    timeout: 60
    temperature: 0.7
    max_tokens: 256000
    request_body: {}
  openai:
    type: openai_compatible
    enabled: false
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY:-}
    model: gpt-4.1-mini
    models:
      - gpt-4.1-mini
      - gpt-4.1
    timeout: 60
    temperature: 0.7
    max_tokens: 8192
    request_body: {}
  siliconflow:
    type: openai_compatible
    enabled: false
    base_url: https://api.siliconflow.cn/v1
    api_key: ${SILICONFLOW_API_KEY:-}
    model: Qwen/Qwen2.5-72B-Instruct
    models:
      - Qwen/Qwen2.5-72B-Instruct
    timeout: 60
    temperature: 0.7
    max_tokens: 8192
    request_body: {}
  ollama:
    type: ollama
    enabled: true
    base_url: http://127.0.0.1:11434
    model: ""
    auto_select: true
    timeout: 120
    temperature: 0.7
    max_tokens: 2048
  builtin:
    type: builtin
    enabled: true
    model: ../model/MiniCPM/MiniCPM5-1B-GGUF/MiniCPM5-1B-Q4_K_M.gguf
    context_length: 102400
    gpu_layers: 0
    threads: 0
    timeout: 300
    temperature: 0.2
    max_tokens: 102400
